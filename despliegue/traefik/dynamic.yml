http:
  routers:
    # Dashboard de Traefik en subdominio dedicado, protegido con Basic Auth.
    # Se accede por: https://traefik.terreta.shop/dashboard/
    traefik-dashboard:
      rule: "Host(`traefik.terreta.shop`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))"
      entryPoints:
        - websecure
      service: api@internal
      middlewares:
        - dashboard-auth
      tls:
        certResolver: letsencrypt
        domains:
          - main: "traefik.terreta.shop"

  middlewares:
    dashboard-auth:
      basicAuth:
        usersFile: /etc/traefik/users.htpasswd

